
name: Beyond the Machine - Script Draft

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        type: string
      angle:
        description: "Main question or angle"
        required: true
        default: "Explain what is real, what remains difficult, and what comes next"
        type: string

permissions:
  contents: read

jobs:
  draft-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate script with Gemini Free Tier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC: ${{ inputs.topic }}
          ANGLE: ${{ inputs.angle }}
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api_key = os.environ.get("GEMINI_API_KEY", "")
          bot_token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "")
          topic = os.environ["TOPIC"].strip()
          angle = os.environ["ANGLE"].strip()

          if not all([api_key, bot_token, chat_id]):
              raise SystemExit("A required GitHub secret is missing.")

          if not topic or len(topic) > 250:
              raise SystemExit("Topic must contain 1-250 characters.")

          if not angle or len(angle) > 300:
              raise SystemExit("Angle must contain 1-300 characters.")

          prompt = f"""
          You are the scriptwriter for Beyond the Machine, a faceless
          YouTube channel about AI and future technology for a US audience.

          TOPIC: {topic}
          EDITORIAL ANGLE: {angle}

          Write an original, engaging narration designed for 8-12 minutes,
          approximately 1,200-1,600 spoken words.

          REQUIRED OUTPUT:

          1. THREE compelling but accurate title options.
          2. A strong opening hook without fabricated statistics.
          3. FULL NARRATION with clear section headings and natural
             transitions. Explain technical concepts in plain English.
          4. VISUAL PLAN with suggested footage, diagrams, graphics,
             and AI visuals for each section.
          5. FACT-CHECK LIST identifying factual claims that need
             verification and primary sources to seek.
          6. DESCRIPTION AND CHAPTERS with approximate timestamps.
          7. THUMBNAIL CONCEPT with visual direction and short text.

          EDITORIAL RULES:
          - Never invent quotations, studies, dates, statistics or events.
          - Do not claim to have browsed or verified sources unless you have.
          - Clearly label uncertainty, predictions and hypothetical scenes.
          - Do not fabricate source URLs or citations.
          - Separate demonstrated capabilities from speculation.
          - Include limitations, counterarguments and safety concerns.
          - Use original wording and natural US English for voice-over.
          - Do not promise virality or earnings.
          - Mark uncertain information for human verification.
          - End by stating that the script requires fact-checking.

          This is a draft, not a verified research report.
          """

          payload = json.dumps({
              "contents": [{
                  "parts": [{"text": prompt}]
              }],
              "generationConfig": {
                  "temperature": 0.7,
                  "maxOutputTokens": 8192
              }
          }).encode()

          # Keep this model consistent with the working configuration
          # in your project. If unavailable, stop rather than pay.
          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.6-flash:generateContent"
          )

          request = urllib.request.Request(
              url,
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=180) as response:
                  data = json.loads(response.read())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")[:1000]
              print(f"Gemini API returned HTTP {exc.code}: {detail}")
              raise SystemExit(
                  "Generation failed. Check model access and free-tier "
                  "quota. No paid upgrade was attempted."
              )
          except Exception as exc:
              raise SystemExit(
                  f"Gemini request failed: {type(exc).__name__}: {exc}"
              )

          candidates = data.get("candidates", [])
          if not candidates:
              raise SystemExit("Gemini returned no candidate.")

          parts = candidates[0].get("content", {}).get("parts", [])
          script = "\n".join(
              p.get("text", "") for p in parts if p.get("text")
          ).strip()

          if len(script) < 1000:
              raise SystemExit("Gemini returned an unexpectedly short draft.")

          # Save script and metadata for the downstream fact-check workflow.
          with open("script.txt", "w", encoding="utf-8") as f:
              f.write(f"TOPIC: {topic}\n")
              f.write(f"ANGLE: {angle}\n\n")
              f.write(script)

          message = (
              "BEYOND THE MACHINE — SCRIPT DRAFT\n"
              f"Topic: {topic}\n\n"
              "AI-generated draft. Facts and sources are NOT verified.\n"
              "Nothing has been uploaded or published.\n\n"
              + script
          )

          # Split at paragraph boundaries for Telegram delivery.
          chunks = []
          while message:
              if len(message) <= 3500:
                  chunks.append(message)
                  break
              cut = message.rfind("\n", 0, 3500)
              if cut < 1500:
                  cut = 3500
              chunks.append(message[:cut])
              message = message[cut:].lstrip()

          for index, chunk in enumerate(chunks, 1):
              body = json.dumps({
                  "chat_id": chat_id,
                  "text": f"PART {index}/{len(chunks)}\n{chunk}",
                  "disable_web_page_preview": True
              }).encode()

              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{bot_token}/sendMessage",
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read())

              if not result.get("ok"):
                  raise SystemExit("Telegram delivery failed.")

              if index < len(chunks):
                  time.sleep(1)

          print("Script generated, saved and sent to Telegram.")
          print("No YouTube upload or publication was attempted.")
          PY

      - name: Save script for fact-checking
        uses: actions/upload-artifact@v4
        with:
          name: gemini-script
          path: script.txt
          retention-days: 7
          if-no-files-found: error
          
